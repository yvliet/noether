<svg xmlns="http://www.w3.org/2000/svg" id="storage_diagram" width="100%" style="max-width: 1040px;" viewBox="0 0 1040 490" role="graphics-document document" aria-roledescription="flowchart-v2">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bc8cff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
  </defs>
  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif !important;
    }
    svg {
      background: transparent !important;
    }
    .cluster-bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.2px;
      rx: 8px;
      ry: 8px;
    }
    .cluster-title {
      fill: #ffffff;
      font-weight: 700;
      font-size: 13.5px;
      text-anchor: middle;
    }
    .cluster-badge {
      fill: #8b949e;
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
    }
    .node-box {
      fill: #161b22;
      stroke: #38404a;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-box-accent-blue {
      fill: #161b22;
      stroke: #1f6feb;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-box-accent-purple {
      fill: #161b22;
      stroke: #8957e5;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-box-accent-green {
      fill: #161b22;
      stroke: #238636;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-title {
      fill: #ffffff;
      font-weight: 700;
      font-size: 12.5px;
      text-anchor: middle;
    }
    .node-sub {
      fill: #8b949e;
      font-weight: 400;
      font-size: 11px;
      text-anchor: middle;
    }
    .edge-path {
      fill: none;
      stroke: #8b949e;
      stroke-width: 1.8px;
    }
    .edge-path-blue {
      fill: none;
      stroke: #58a6ff;
      stroke-width: 2px;
    }
    .edge-path-purple {
      fill: none;
      stroke: #bc8cff;
      stroke-width: 2px;
    }
    .edge-path-green {
      fill: none;
      stroke: #3fb950;
      stroke-width: 1.8px;
      stroke-dasharray: 4, 3;
    }
    .edge-label-bg {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      rx: 4px;
      ry: 4px;
    }
    .edge-label-text {
      fill: #ffffff;
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>

  <!-- ==================== COLUMN 1: WORKSPACE & STATE LAYER ==================== -->
  <g id="col-workspace">
    <rect class="cluster-bg" x="16" y="20" width="240" height="450" />
    <text class="cluster-title" x="136" y="44">1. Workspace &amp; State Layer</text>

    <!-- Node: Live Editor Buffer -->
    <g transform="translate(31, 62)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Live Preview Editor</text>
      <text class="node-sub" x="105" y="41">Active Typing Buffer (Sub-8ms)</text>
    </g>

    <!-- Internal arrow: Editor to AST -->
    <path class="edge-path" d="M 136, 116 L 136, 137" marker-end="url(#arrow)" />

    <!-- Node: AST Extractor -->
    <g transform="translate(31, 142)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">AST Node &amp; Frontmatter</text>
      <text class="node-sub" x="105" y="41">Dirty-Range AST Scanner</text>
    </g>

    <!-- Internal arrow: AST to Zustand -->
    <path class="edge-path" d="M 136, 196 L 136, 217" marker-end="url(#arrow)" />

    <!-- Node: Zustand Reactive Stores -->
    <g transform="translate(31, 222)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Zustand State Stores</text>
      <text class="node-sub" x="105" y="41">Reactive In-Memory Cache</text>
    </g>

    <!-- Internal arrow: Zustand to Platform Bridge -->
    <path class="edge-path" d="M 136, 276 L 136, 297" marker-end="url(#arrow)" />

    <!-- Node: Platform Bridge -->
    <g transform="translate(31, 302)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">IPlatformAdapter</text>
      <text class="node-sub" x="105" y="41">Cross-Platform Neutrality Bridge</text>
    </g>

    <!-- Internal arrow: Platform Bridge to EventBus -->
    <path class="edge-path" d="M 136, 356 L 136, 377" marker-end="url(#arrow)" />

    <!-- Node: Typed EventBus -->
    <g transform="translate(31, 382)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Typed EventBus</text>
      <text class="node-sub" x="105" y="41">Micro-Kernel Pub/Sub (IoC)</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: DUAL CONCURRENT ENGINES ==================== -->
  <!-- Cluster 2A: Markdown File Persistence Track -->
  <g id="col-persistence-track">
    <rect class="cluster-bg" x="320" y="20" width="380" height="205" />
    <text class="cluster-title" x="510" y="44">2A. Markdown Persistence Engine</text>

    <!-- Node: Debounced Save Coordinator -->
    <g transform="translate(335, 58)">
      <rect class="node-box-accent-blue" x="0" y="0" width="350" height="46" />
      <text class="node-title" x="175" y="20">Debounced Save Coordinator</text>
      <text class="node-sub" x="175" y="36">Active Typing Buffer Protection</text>
    </g>

    <!-- Internal arrow: Debounce to Atomic Rename -->
    <path class="edge-path-blue" d="M 510, 104 L 510, 114" marker-end="url(#arrow-blue)" />

    <!-- Node: Atomic Temp-and-Rename -->
    <g transform="translate(335, 118)">
      <rect class="node-box-accent-blue" x="0" y="0" width="350" height="46" />
      <text class="node-title" x="175" y="20">Atomic Temp-and-Rename</text>
      <text class="node-sub" x="175" y="36">fs::write(&amp;temp_file) ➔ fs::rename(&amp;target)</text>
    </g>

    <!-- Internal arrow: Atomic Rename to Echo Suppression -->
    <path class="edge-path-blue" d="M 510, 164 L 510, 172" marker-end="url(#arrow-blue)" />

    <!-- Node: Deterministic Echo Suppression -->
    <g transform="translate(335, 174)">
      <rect class="node-box-accent-blue" x="0" y="0" width="350" height="42" />
      <text class="node-title" x="175" y="18">Deterministic Echo Suppression</text>
      <text class="node-sub" x="175" y="33">LAST_INTERNAL_WRITE Signature Guard</text>
    </g>
  </g>

  <!-- Cluster 2B: Native SQLite Engine Track -->
  <g id="col-sqlite-track">
    <rect class="cluster-bg" x="320" y="245" width="380" height="225" />
    <text class="cluster-title" x="510" y="269">2B. Native rusqlite Engine (WAL)</text>

    <!-- Node: Direct Tauri IPC -->
    <g transform="translate(335, 285)">
      <rect class="node-box-accent-purple" x="0" y="0" width="350" height="46" />
      <text class="node-title" x="175" y="20">Direct Tauri IPC Invocation</text>
      <text class="node-sub" x="175" y="36">Zero WASM Heap Buffers &amp; Zero UI Overhead</text>
    </g>

    <!-- Internal arrow: IPC to FTS5 -->
    <path class="edge-path-purple" d="M 510, 331 L 510, 341" marker-end="url(#arrow-purple)" />

    <!-- Node: FTS5 Search Indexer -->
    <g transform="translate(335, 345)">
      <rect class="node-box-accent-purple" x="0" y="0" width="350" height="46" />
      <text class="node-title" x="175" y="20">SQLite FTS5 BM25 Ranked Index</text>
      <text class="node-sub" x="175" y="36">Block-Level unicode61 Tokenization</text>
    </g>

    <!-- Internal arrow: FTS5 to WAL Commits -->
    <path class="edge-path-purple" d="M 510, 391 L 510, 401" marker-end="url(#arrow-purple)" />

    <!-- Node: Direct WAL Page Commits -->
    <g transform="translate(335, 405)">
      <rect class="node-box-accent-purple" x="0" y="0" width="350" height="46" />
      <text class="node-title" x="175" y="20">Direct Page-Level Commits (WAL)</text>
      <text class="node-sub" x="175" y="36">PRAGMA synchronous = NORMAL (256MB mmap)</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: PHYSICAL DISK VAULT ==================== -->
  <g id="col-disk-vault">
    <rect class="cluster-bg" x="760" y="20" width="264" height="450" />
    <text class="cluster-title" x="892" y="44">3. Local File System Vault</text>

    <!-- Node: Markdown Files -->
    <g transform="translate(777, 65)">
      <rect class="node-box-accent-blue" x="0" y="0" width="230" height="60" />
      <text class="node-title" x="115" y="26">*.md Markdown Files</text>
      <text class="node-sub" x="115" y="44">100% Physical Ground Truth</text>
    </g>

    <!-- Node: file_manifest Diff Reindexer -->
    <g transform="translate(777, 185)">
      <rect class="node-box-accent-green" x="0" y="0" width="230" height="54" />
      <text class="node-title" x="115" y="24">file_manifest Diff Indexer</text>
      <text class="node-sub" x="115" y="41">O(N) Hash Scan on Cold Boot / Sync</text>
    </g>

    <!-- Node: SQLite Database -->
    <g transform="translate(777, 295)">
      <rect class="node-box-accent-purple" x="0" y="0" width="230" height="60" />
      <text class="node-title" x="115" y="26">flint.sqlite &amp; WAL</text>
      <text class="node-sub" x="115" y="44">Relational Graph &amp; FTS5 Index</text>
    </g>

    <!-- Node: Trash Safety -->
    <g transform="translate(777, 395)">
      <rect class="node-box" x="0" y="0" width="230" height="46" />
      <text class="node-title" x="115" y="20">.trash/ Safety Folder</text>
      <text class="node-sub" x="115" y="36">Soft-Delete Crash Protection</text>
    </g>
  </g>

  <!-- ==================== CROSS-TIER DATA FLOW ARROWS ==================== -->

  <!-- 1. Track A: Workspace to Markdown Persistence Engine -->
  <path class="edge-path-blue" d="M 241, 89 L 327, 81" marker-end="url(#arrow-blue)" />
  <g transform="translate(254, 73)">
    <rect class="edge-label-bg" x="0" y="0" width="60" height="18" />
    <text class="edge-label-text" x="30" y="9">Note Save</text>
  </g>

  <!-- 2. Track A: Markdown Persistence to Physical *.md Files -->
  <path class="edge-path-blue" d="M 685, 141 C 730, 141 730, 95 769, 95" marker-end="url(#arrow-blue)" />
  <g transform="translate(690, 107)">
    <rect class="edge-label-bg" x="0" y="0" width="82" height="18" />
    <text class="edge-label-text" x="41" y="9">Atomic Rename</text>
  </g>

  <!-- 3. Track B: Workspace to Native rusqlite Engine -->
  <path class="edge-path-purple" d="M 241, 329 C 285, 329 285, 308 327, 308" marker-end="url(#arrow-purple)" />
  <g transform="translate(250, 310)">
    <rect class="edge-label-bg" x="0" y="0" width="68" height="18" />
    <text class="edge-label-text" x="34" y="9">Tauri IPC</text>
  </g>

  <!-- 4. Track B: rusqlite WAL Commits to flint.sqlite -->
  <path class="edge-path-purple" d="M 685, 428 C 735, 428 735, 325 769, 325" marker-end="url(#arrow-purple)" />
  <g transform="translate(688, 385)">
    <rect class="edge-label-bg" x="0" y="0" width="86" height="18" />
    <text class="edge-label-text" x="43" y="9">WAL Commits</text>
  </g>

  <!-- 5. Reconciliation: *.md to file_manifest -->
  <path class="edge-path-green" d="M 892, 125 L 892, 177" marker-end="url(#arrow-green)" />
  <g transform="translate(850, 145)">
    <rect class="edge-label-bg" x="0" y="0" width="84" height="18" />
    <text class="edge-label-text" x="42" y="9">Diff Scan O(N)</text>
  </g>

  <!-- 6. Reconciliation: file_manifest to SQLite Engine -->
  <path class="edge-path-green" d="M 777, 212 C 735, 212 735, 368 693, 368" marker-end="url(#arrow-green)" />
  <g transform="translate(702, 275)">
    <rect class="edge-label-bg" x="0" y="0" width="68" height="18" />
    <text class="edge-label-text" x="34" y="9">Sync Index</text>
  </g>

</svg>
