  <!-- ==================== HORIZONTAL INTER-COLUMN CONNECTORS ==================== -->
  <!-- Col 1 to Col 2 -->
  <path class="edge-path" d="M 236, 185 L 286, 185" marker-end="url(#arrow)" />
  <g transform="translate(244, 175)">
