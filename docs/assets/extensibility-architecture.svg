      <text class="node-title" x="105" y="24">Native Stdio MCP Server</text>
      <text class="node-sub" x="105" y="41">AI Agents (Claude, Cursor, AGY)</text>
    </g>

    <!-- Node: Native rusqlite -->
    <g transform="translate(808, 318)">
      <rect class="node-box-accent-green" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Native rusqlite WAL</text>
      <text class="node-sub" x="105" y="41">Direct SQLite Page Commits</text>
    </g>

    <!-- Node: EventBus Telemetry -->
    <g transform="translate(808, 398)">
      <rect class="node-box-accent-cyan" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">EventBus Telemetry</text>
      <text class="node-sub" x="105" y="41">Off-Thread Progress Streaming</text>
    </g>
