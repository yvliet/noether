    <text class="edge-label-text" x="17" y="10">SDK</text>
  </g>

  <path class="edge-path" d="M 236, 345 L 286, 345" marker-end="url(#arrow)" />
  <g transform="translate(244, 335)">
    <rect class="edge-label-bg" x="0" y="0" width="34" height="20" />
    <text class="edge-label-text" x="17" y="10">Events</text>
  </g>

  <!-- Col 2 to Col 3 -->
  <path class="edge-path" d="M 496, 265 L 548, 265" marker-end="url(#arrow)" />
  <g transform="translate(504, 255)">
    <rect class="edge-label-bg" x="0" y="0" width="36" height="20" />
    <text class="edge-label-text" x="18" y="10">IoC Reg</text>
  </g>

  <!-- Col 3 to Col 4 (Specialized Subsystem Bridges) -->
  <!-- Row 1: Slots (Blue) -->
  <path class="edge-path-blue" d="M 758, 105 L 808, 105" marker-end="url(#arrow-blue)" />
  <g transform="translate(764, 95)">
    <rect class="edge-label-bg" style="stroke: #1f6feb;" x="0" y="0" width="38" height="20" />
    <text class="edge-label-text" style="fill: #58a6ff;" x="19" y="10">Portals</text>
  </g>

  <!-- Row 2: Editor (Purple) -->
  <path class="edge-path-purple" d="M 758, 185 L 808, 185" marker-end="url(#arrow-purple)" />
  <g transform="translate(764, 175)">
    <rect class="edge-label-bg" style="stroke: #8957e5;" x="0" y="0" width="38" height="20" />
    <text class="edge-label-text" style="fill: #bc8cff;" x="19" y="10">Hooks</text>
  </g>

  <!-- Row 3: MCP (Amber) -->
  <path class="edge-path-amber" d="M 758, 265 L 808, 265" marker-end="url(#arrow-amber)" />
  <g transform="translate(764, 255)">
    <rect class="edge-label-bg" style="stroke: #9e6a03;" x="0" y="0" width="38" height="20" />
