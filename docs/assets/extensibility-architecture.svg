<svg xmlns="http://www.w3.org/2000/svg" id="extensibility_diagram" width="100%" style="max-width: 1040px;" viewBox="0 0 1040 500" role="graphics-document document" aria-roledescription="flowchart-v2">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#bc8cff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d29922" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#39c5bb" />
    </marker>
  </defs>
  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif !important;
    }
    svg {
      background: transparent !important;
    }
    .cluster-bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.2px;
      rx: 8px;
      ry: 8px;
    }
    .cluster-title {
      fill: #ffffff;
      font-weight: 700;
      font-size: 13.5px;
      text-anchor: middle;
    }
    .cluster-badge {
      fill: #8b949e;
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
    }
    .node-box {
      fill: #161b22;
      stroke: #38404a;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-box-accent-blue {
      fill: #161b22;
      stroke: #1f6feb;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-box-accent-purple {
      fill: #161b22;
      stroke: #8957e5;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-box-accent-amber {
      fill: #161b22;
      stroke: #9e6a03;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-box-accent-green {
      fill: #161b22;
      stroke: #238636;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-box-accent-cyan {
      fill: #161b22;
      stroke: #1f883d;
      stroke-width: 1.2px;
      rx: 6px;
      ry: 6px;
    }
    .node-title {
      fill: #ffffff;
      font-weight: 700;
      font-size: 12.5px;
      text-anchor: middle;
    }
    .node-sub {
      fill: #8b949e;
      font-weight: 400;
      font-size: 11px;
      text-anchor: middle;
    }
    .edge-path {
      fill: none;
      stroke: #8b949e;
      stroke-width: 1.8px;
    }
    .edge-path-blue {
      fill: none;
      stroke: #58a6ff;
      stroke-width: 1.8px;
    }
    .edge-path-purple {
      fill: none;
      stroke: #bc8cff;
      stroke-width: 1.8px;
    }
    .edge-path-amber {
      fill: none;
      stroke: #d29922;
      stroke-width: 1.8px;
    }
    .edge-path-green {
      fill: none;
      stroke: #3fb950;
      stroke-width: 1.8px;
    }
    .edge-path-cyan {
      fill: none;
      stroke: #39c5bb;
      stroke-width: 1.8px;
    }
    .edge-label-bg {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1px;
      rx: 4px;
      ry: 4px;
    }
    .edge-label-text {
      fill: #ffffff;
      font-size: 10px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }
