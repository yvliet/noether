  <!-- ==================== COLUMN 1: EXTENSIONS LAYER ==================== -->
  <g id="col-extensions">
    <rect class="cluster-bg" x="16" y="20" width="230" height="460" />
    <text class="cluster-title" x="131" y="44">1. Extension Layer</text>
    <text class="cluster-badge" x="131" y="60">User Space / Sandboxed</text>

    <!-- Node: Core Extensions -->
    <g transform="translate(26, 78)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Core Extensions</text>
      <text class="node-sub" x="105" y="41">Graph, Canvas, Tasks, FSRS</text>
    </g>

    <!-- Node: Community Extensions -->
    <g transform="translate(26, 158)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Community Extensions</text>
      <text class="node-sub" x="105" y="41">User Plugins (.flint/plugins)</text>
    </g>

    <!-- Node: Core Isolation -->
    <g transform="translate(26, 238)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Strict Core Isolation</text>
      <text class="node-sub" x="105" y="41">Zero Native Directory Imports</text>
    </g>

    <!-- Node: Dynamic Lifecycle -->
    <g transform="translate(26, 318)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Dynamic Lifecycle</text>
      <text class="node-sub" x="105" y="41">onload() &amp; Auto Cleanup</text>
    </g>

    <!-- Node: Extension Schemas -->
    <g transform="translate(26, 398)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Isolated SQLite Tables</text>
      <text class="node-sub" x="105" y="41">Dedicated DB Namespace</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: FLINT SDK LAYER ==================== -->
  <g id="col-sdk">
    <rect class="cluster-bg" x="276" y="20" width="230" height="460" />
    <text class="cluster-title" x="391" y="44">2. Flint SDK Layer</text>
    <text class="cluster-badge" x="391" y="60">Public API Contracts (src/sdk)</text>

    <!-- Node: Extension Base Class -->
    <g transform="translate(286, 78)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Extension Base Class</text>
      <text class="node-sub" x="105" y="41">Unified Extension API</text>
    </g>

    <!-- Node: Zod Validation -->
    <g transform="translate(286, 158)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Zod Schema Engine</text>
      <text class="node-sub" x="105" y="41">Type-Safe Introspection</text>
    </g>

    <!-- Node: React Hooks & Types -->
    <g transform="translate(286, 238)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">React Hooks &amp; Helpers</text>
      <text class="node-sub" x="105" y="41">usePortalSlots, useEditorPlugins</text>
    </g>

    <!-- Node: EventBus Bridge -->
    <g transform="translate(286, 318)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Typed EventBus SDK</text>
      <text class="node-sub" x="105" y="41">Decoupled Pub/Sub Signals</text>
    </g>

    <!-- Node: Platform Bridge -->
    <g transform="translate(286, 398)">
      <rect class="node-box" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">Platform Bridge</text>
      <text class="node-sub" x="105" y="41">IPlatformAdapter Safe Routing</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: MICRO-KERNEL REGISTRIES ==================== -->
  <g id="col-registries">
    <rect class="cluster-bg" x="536" y="20" width="235" height="460" />
    <text class="cluster-title" x="653" y="44">3. Micro-Kernel IoC</text>
    <text class="cluster-badge" x="653" y="60">Registries &amp; Background Services</text>

    <!-- Node: SlotRegistry -->
    <g transform="translate(548, 78)">
      <rect class="node-box-accent-blue" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">SlotRegistry</text>
      <text class="node-sub" x="105" y="41">Dynamic UI Layout Portals</text>
    </g>

    <!-- Node: EditorRegistry -->
    <g transform="translate(548, 158)">
      <rect class="node-box-accent-purple" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">EditorRegistry</text>
      <text class="node-sub" x="105" y="41">ProseMirror Plugins &amp; Hooks</text>
    </g>

    <!-- Node: ToolRegistry -->
    <g transform="translate(548, 238)">
      <rect class="node-box-accent-amber" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">ToolRegistry</text>
      <text class="node-sub" x="105" y="41">Zod-to-MCP Server Validation</text>
    </g>

    <!-- Node: DatabaseManager -->
    <g transform="translate(548, 318)">
      <rect class="node-box-accent-green" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">DatabaseManager</text>
      <text class="node-sub" x="105" y="41">Versioned DDL &amp; Cascades</text>
    </g>

    <!-- Node: WorkerPool -->
    <g transform="translate(548, 398)">
      <rect class="node-box-accent-cyan" x="0" y="0" width="210" height="54" />
      <text class="node-title" x="105" y="24">WorkerPool</text>
      <text class="node-sub" x="105" y="41">Off-Thread Web Worker Tasks</text>
    </g>
  </g>

  <!-- ==================== COLUMN 4: HOST PRESENTATION & CORE ==================== -->
  <g id="col-host">
    <rect class="cluster-bg" x="801" y="20" width="225" height="460" />
    <text class="cluster-title" x="913" y="44">4. Host Presentation &amp; Core</text>
    <text class="cluster-badge" x="913" y="60">Native Tauri v2 &amp; React 19</text>

    <!-- Node: PortalSlotHost -->
    <g transform="translate(808, 78)">
